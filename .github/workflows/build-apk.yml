name: Build Signed FTV TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Gradle 8.5 নির্দিষ্ট করে সেটআপ করা হচ্ছে
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Find Project Directory & Build
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
        cd $PROJECT_DIR
        
        # সিস্টেমের Gradle 8.5 ব্যবহার করে বিল্ড
        gradle assembleRelease --no-daemon
        
        mkdir -p $GITHUB_WORKSPACE/build_output
        cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/build_output/ || cp */build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/build_output/

    - name: Generate Certificate & Sign APK
      run: |
        cd $GITHUB_WORKSPACE/build_output
        keytool -genkey -v -keystore release.keystore -alias ftvtv_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 12345678 -keypass 12345678 -dname "CN=Sayful Islam, OU=FTV, O=FTV, L=Dhaka, C=BD"
        
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        UNSIGNED_APK=$(ls *.apk | head -n 1)
        SIGNED_APK="FTV-TV-Signed.apk"
        
        $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:12345678 --ks-key-alias ftvtv_key --key-pass pass:12345678 --out $SIGNED_APK $UNSIGNED_APK

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: FTV-TV-Signed-APK
        path: build_output/FTV-TV-Signed.apk
