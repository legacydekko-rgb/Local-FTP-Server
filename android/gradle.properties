# ============================================================================
# FILE: android/gradle.properties
# ============================================================================
# Gradle build settings for Android Studio and the GitHub Actions cloud build.

# Memory for the build daemon. 2 GB is plenty for a project this size and keeps
# the GitHub free runner happy.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# --- AndroidX ---------------------------------------------------------------
# This app uses AndroidX libraries and AGP 8 modern configuration.
android.useAndroidX=true
android.enableJetifier=false

# Faster, smaller R class generation. Safe here: the app only references
# resources from its own module.
android.nonTransitiveRClass=true

# Keep resource and source ids non-final for incremental builds.
android.nonFinalResIds=false

# --- Fix for AGP / Gradle Dependency Resolution Error ---
# This disables the new strict configuration assertion that caused the build to fail on Gradle 9/AGP
android.dependencyResolutionManagement.withProjectDependencies=true
android.overridePathCheck=true
